<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111111;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c084fc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <filter id="glowA">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background — fully square per Apple requirements -->
  <rect width="512" height="512" fill="url(#bgGradA)"/>

  <!-- Glow accent -->
  <circle cx="390" cy="122" r="150" fill="#c084fc" opacity="0.10"/>

  <!-- Purple accent bar -->
  <rect x="48" y="448" width="160" height="6" rx="3" fill="url(#accentGradA)"/>

  <!-- "T" lettermark -->
  <text
    x="256"
    y="310"
    text-anchor="middle"
    font-family="-apple-system, system-ui, BlinkMacSystemFont, sans-serif"
    font-size="220"
    font-weight="900"
    letter-spacing="-8"
    fill="#ffffff"
    filter="url(#glowA)"
  >T</text>

  <!-- Purple dot accent -->
  <circle cx="365" cy="165" r="14" fill="#c084fc" opacity="0.9"/>
</svg>
