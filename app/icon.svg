<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111111;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c084fc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#bgGrad)"/>

  <!-- Glow accent circle -->
  <circle cx="400" cy="112" r="160" fill="#c084fc" opacity="0.08"/>

  <!-- Purple bottom accent bar -->
  <rect x="48" y="440" width="180" height="6" rx="3" fill="url(#accentGrad)"/>

  <!-- "T" lettermark -->
  <text
    x="256"
    y="310"
    text-anchor="middle"
    font-family="-apple-system, system-ui, BlinkMacSystemFont, sans-serif"
    font-size="220"
    font-weight="900"
    letter-spacing="-8"
    fill="#ffffff"
    filter="url(#glow)"
  >T</text>

  <!-- Purple dot accent -->
  <circle cx="368" cy="160" r="14" fill="#c084fc" opacity="0.9"/>
</svg>
